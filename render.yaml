# One-click hosting on Render (https://render.com): New → Blueprint → pick this repo.
# Free plan = good for a preview link. For the real shop, switch to the Starter plan
# and add a disk (see README → Hosting) so orders and chats survive restarts.
services:
  - type: web
    name: soma-diamonds
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_TOKEN
        generateValue: true # Render makes a long random admin password; copy it from the Environment tab
      - key: SUPPLIER_PROVIDER
        value: manual # change to "fazercards" and add FAZER_API_KEY when you're ready for automatic delivery
      - key: USD_TO_NU
        value: "97"
      - key: MIN_MARGIN_PERCENT
        value: "10"
